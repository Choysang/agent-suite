# 受控标签注册表 (taxonomy.yml)
# 知识库唯一的标签受控词表。所有卡片的 tags 必须属于这里登记的「域/主题」。
# 改完后运行 kb build 自动更新 ROUTER.md 与二级路由。

split_threshold: 40

domains:
  general:
    name: 通用工程与心智
    keywords: [Agent, 准则, 经验, 心流, 规范]
    redline: "未验证假设严禁作为事实入库；卡片必须明确 when 与 not_when"
    topics:
      准则与规范: [宪法, 纪律, 证据分级]
      工具链: [CLI, Git, 编辑器]
  backend:
    name: 后端与云原生
    keywords: [Python, Node, Go, Docker, API, 数据库]
    redline: "产物先写临时文件再原子替换；高危删除必须用户二次确认"
    topics:
      架构设计: [微服务, 模块化, 性能优化]
      数据与存储: [SQL, 缓存, 事务]
  frontend:
    name: 前端与交互
    keywords: [React, Vue, TypeScript, CSS, UI]
    redline: "前后端严禁强耦合；状态变更必须响应式可观测"
    topics:
      组件与设计: [设计系统, 响应式, 状态机]
