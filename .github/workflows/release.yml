name: Check and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install verification dependencies
        run: |
          python -m pip install 'PyYAML>=6' pytest
          npm ci --ignore-scripts
          npm ci --prefix handoff --ignore-scripts
      - name: Verify suite and modules
        run: npm run verify

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Package the suite and three modules
        run: |
          mkdir -p dist
          git archive --format=zip --prefix="agent-suite/" --output="dist/agent-suite.zip" HEAD
          for module in guidelines knowledge handoff; do
            git archive --format=zip --prefix="$module/" --output="dist/$module.zip" "HEAD:$module"
          done
          (cd dist && sha256sum *.zip > SHA256SUMS)
      - name: Publish downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS \
            --verify-tag --title "Agent Suite $RELEASE_TAG" \
            --notes '提供 agent-suite 全套与 guidelines、knowledge、handoff 三个独立包。更新与验证范围见 README。'
